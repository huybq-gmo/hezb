<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}

:root[data-theme=dark]{--bg:#0B1020;--bg2:#111833;--tx:#E8ECF6;--mu:#98A2B8;--bd:#222B4A;--cd:#121A36}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Inter,'Helvetica Neue',Arial,sans-serif}
a{color:inherit;text-decoration:none}.w{max-width:1120px;margin:0 auto;padding:0 20px}
header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.nav .w{display:flex;align-items:center;gap:20px;height:64px}.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:22px}

.btn.p{background:var(--pr);border-color:var(--pr);color:#fff}.btn.p:hover{filter:brightness(1.1)}.btn.s{padding:6px 12px;font-size:13px}
.lang{padding:6px 10px;font-size:13px}
.hero{padding:88px 0 72px;background:radial-gradient(60% 80% at 80% 0,color-mix(in srgb,var(--pr) 22%,transparent),transparent),radial-gradient(40% 60% at 0 100%,color-mix(in srgb,var(--ac) 18%,transparent),transparent)}
.tag{display:inline-block;font-size:13px;color:var(--pr);border:1px solid var(--bd);background:var(--cd);padding:4px 12px;border-radius:99px;margin-bottom:20px}

section{padding:72px 0}.alt{background:var(--bg2)}.sub{color:var(--mu);max-width:620px;margin:0 0 36px}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:22px}.card p{margin:0;color:var(--mu);font-size:15px}
.ic{width:40px;height:40px;border-radius:10px;background:color-mix(in srgb,var(--pr) 14%,transparent);color:var(--pr);display:grid;place-items:center;font-weight:700;margin-bottom:14px}
.proj{padding:0;overflow:hidden;display:block;transition:transform .15s}.proj:hover{transform:translateY(-3px)}
.thumb{height:150px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:28px;letter-spacing:-.02em}
.proj .b{padding:18px}.chip{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--bg2);color:var(--mu);margin:8px 6px 0 0;border:1px solid var(--bd)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin-top:48px}.stats b{font-size:32px;display:block;color:var(--pr)}
.cta{background:linear-gradient(135deg,#4F46E5,#312E81);color:#fff;border-radius:24px;padding:48px 28px;text-align:center}.cta p{color:#CBD0F5;margin:0 auto 24px;max-width:520px}
.cta .btn{background:#fff;color:#312E81;border:0}
footer{border-top:1px solid var(--bd);padding:32px 0;color:var(--mu);font-size:14px}footer .w{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.filters .btn.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
label{display:block;font-size:14px;font-weight:500;margin:0 0 6px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pr);outline-offset:-1px}.f{margin-bottom:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ct{display:grid;grid-template-columns:1.4fr 1fr;gap:32px}.ok{background:#10B98122;border:1px solid #10B981;padding:12px 16px;border-radius:10px;margin-bottom:16px}
.crumb{color:var(--mu);font-size:14px;margin-bottom:16px;display:block}.det{display:grid;grid-template-columns:2fr 1fr;gap:32px}.det dl{margin:0}.det dt{font-size:13px;color:var(--mu)}.det dd{margin:0 0 14px;font-weight:500}
/* admin */
.adm{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px)}.side{background:var(--bg2);border-right:1px solid var(--bd);padding:20px 14px}
.side a{display:block;padding:9px 12px;border-radius:8px;color:var(--mu);font-size:15px;margin-bottom:2px}.side a.on{background:var(--cd);color:var(--tx);border:1px solid var(--bd)}
.main{padding:28px;min-width:0}.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{text-align:left;color:var(--mu);font-weight:500;padding:10px;border-bottom:1px solid var(--bd)}.tbl td{padding:10px;border-bottom:1px solid var(--bd);vertical-align:middle}
.sc{overflow-x:auto}.pill{font-size:12px;padding:2px 10px;border-radius:99px;background:#10B98122;color:#10B981}.pill.d{background:#F59E0B22;color:#F59E0B}
.ban{background:#F59E0B22;border-bottom:1px solid #F59E0B;font-size:13px;padding:6px 20px;text-align:center}
@media(max-width:800px){.nav nav{gap:14px}.nav nav a.h{display:none}.ct,.det,.two{grid-template-columns:1fr}.adm{grid-template-columns:1fr}.side{display:flex;gap:6px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd);padding:10px}.side a{white-space:nowrap;margin:0}.hero{padding:56px 0 48px}section{padding:48px 0}}
</style></head><body>

function members(){const l=MB.filter(m=>m.pub);return`<section><div class="w"><h2>${t().mt}</h2><p class="sub">${t().mps}</p><div class="grid g3">${l.map(memberCard).join('')}</div></div></section>${foot()}`}
function staticPage(kind){const isAbout=kind==='about';return`<section><div class="w"><h2>${isAbout?t().about:t().careers}</h2><p class="lead">${isAbout?t().aboutP:t().careersP}</p><div class="card" style="max-width:760px"><h3>${isAbout?(L==='vi'?'Cùng xây dựng điều tiếp theo':'Build what comes next together'):(L==='vi'?'Cơ hội tại Hezb':'Opportunities at Hezb')}</h3><p>${isAbout?(L==='vi'?'Chúng tôi kết hợp tư duy sản phẩm, kỹ thuật và thiết kế để tạo ra những giải pháp hữu ích trong thế giới thật.':'We combine product thinking, engineering and design to create useful solutions for the real world.'):t().careersS}</p></div><p style="margin-top:24px"><a class="btn p" href="#/contact">${t().c1}</a></p></div></section>${foot()}`}
function detail(id){const p=P.find(x=>x.id==id);if(!p)return projects();return`<section><div class="w"><a class="crumb" href="#/projects">${t().back}</a><div class="thumb" style="height:260px;border-radius:20px;margin-bottom:32px;background:linear-gradient(135deg,${p.c[0]},${p.c[1]})">${h(p.name.replace('Sample ',''))}</div><div class="det"><div><h2>${h(p.t[L])}</h2><p class="lead" style="font-size:17px">${h(p.d[L])}</p><h3>${t().res}</h3><p style="color:var(--pr);font-weight:600;font-size:20px">${h(p.r[L])}</p></div><div class="card"><dl><dt>${t().client}</dt><dd>${h(p.client)}</dd><dt>${t().year}</dt><dd>${p.year}</dd><dt>${t().cat}</dt><dd>${t().cats[p.cat]}</dd><dt>${t().tech}</dt><dd>${p.tech.map(x=>`<span class="chip">${h(x)}</span>`).join('')}</dd></dl><a class="btn p" href="#/contact" style="width:100%;justify-content:center">${t().c1}</a></div></div></div></section>${foot()}`}
function contact(){return`<section><div class="w"><h2>${t().ct}</h2><p class="sub">${t().cts}</p><div class="ct"><div class="card">${sent?`<div class="ok">${t().done}</div>`:''}<div class="two"><div class="f"><label>${t().name} *</label><input id="cn"></div><div class="f"><label>${t().email} *</label><input id="ce" type="email"></div></div><div class="two"><div class="f"><label>${t().co}</label><input id="cc"></div><div class="f"><label>${t().phone}</label><input id="cp"></div></div><div class="f"><label>${t().topic}</label><select id="ct">${t().topics.map((x,i)=>`<option value="${i}">${x}</option>`).join('')}</select></div><div class="f"><label>${t().msg} *</label><textarea id="cm" rows="5"></textarea></div><button class="btn p" onclick="submitC()">${t().send}</button></div>
<div><div class="card" style="margin-bottom:16px"><h3>Email</h3><p>hello@hezb.example</p></div><div class="card" style="margin-bottom:16px"><h3>${t().phone}</h3><p>+84 000 000 000</p></div><div class="card"><h3>${L=='vi'?'Địa chỉ':'Address'}</h3><p>Ho Chi Minh City, Vietnam</p></div></div></div></div></section>${foot()}`}
function submitC(){const n=$('#cn').value,e=$('#ce').value,m=$('#cm').value;if(!n||!e||!m){alert(L=='vi'?'Vui lòng điền các trường bắt buộc':'Please fill required fields');return}
M.unshift({n,e,co:$('#cc').value,tp:+$('#ct').value,m,d:'Now',new:1});sent=1;render()}
function admin(sec){const side=`<aside class="side">${[['','Dashboard'],['projects','Dự án / Projects'],['members','Thành viên / Members'],['messages','Liên hệ / Messages']].map(x=>`<a class="${(sec||'')==x[0]?'on':''}" href="#/admin${x[0]?'/'+x[0]:''}">${x[1]}</a>`).join('')}<a href="#/">← Xem website</a></aside>`;let b='';
if(!sec)b=`<h2>Dashboard</h2><div class="stats" style="margin:20px 0 32px">${[['Dự án',P.length],['Đã đăng',P.filter(p=>p.pub).length],['Thành viên',MB.filter(m=>m.pub).length],['Tin nhắn mới',M.filter(m=>m.new).length],['Tổng liên hệ',M.length]].map(s=>`<div class="card"><b>${s[1]}</b>${s[0]}</div>`).join('')}</div><h3>Liên hệ gần đây</h3><div class="card sc">${msgTbl(M.slice(0,4))}</div>`;
else if(sec=='members')b=`<h2>Thành viên / Members</h2><div class="card sc" style="margin-top:20px"><table class="tbl"><tr><th>Thành viên</th><th>Vai trò</th><th>Trạng thái</th></tr>${MB.map(m=>`<tr><td><b>${h(m.t.vi)}</b><br><span style="color:var(--mu)">${h(m.t.en)}</span></td><td>${h(m.r[L])}</td><td><span class="pill ${m.pub?'':'d'}">${m.pub?'Đã đăng':'Nháp'}</span></td></tr>`).join('')}</table></div>`;
else if(sec=='messages')b=`<h2>Liên hệ / Messages</h2><div class="card sc" style="margin-top:20px">${msgTbl(M)}</div>`;
else if(edit!==null)b=editor();
else b=`<div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Dự án / Projects</h2><button class="btn p" onclick="newP()">+ Thêm dự án</button></div><div class="card sc" style="margin-top:20px"><table class="tbl"><tr><th>Dự án</th><th>Lĩnh vực</th><th>Năm</th><th>Nổi bật</th><th>Trạng thái</th><th></th></tr>${P.map((p,i)=>`<tr><td><b>${h(p.t.vi)}</b><br><span style="color:var(--mu)">${h(p.t.en)}</span></td><td>${t().cats[p.cat]}</td><td>${p.year}</td><td><input type="checkbox" style="width:auto" ${p.feat?'checked':''} onchange="P[${i}].feat=this.checked?1:0"></td><td><span class="pill ${p.pub?'':'d'}">${p.pub?'Đã đăng':'Nháp'}</span></td><td><button class="btn s" onclick="edit=${i};render()">Sửa</button> <button class="btn s" onclick="P.splice(${i},1);render()">Xóa</button></td></tr>`).join('')}</table></div>`;
return`<div class="ban">UI mẫu – chưa có đăng nhập/lưu dữ liệu thật · Mockup only</div><div class="adm">${side}<div class="main">${b}</div></div>`}
const msgTbl=a=>`<table class="tbl"><tr><th>Người gửi</th><th>Quan tâm</th><th>Nội dung</th><th>Ngày</th><th></th></tr>${a.map(m=>`<tr><td><b>${h(m.n)}</b><br><span style="color:var(--mu)">${h(m.e)}${m.co?' · '+h(m.co):''}</span></td><td>${T.vi.topics[m.tp]}</td><td>${h(m.m)}</td><td>${m.d}</td><td>${m.new?'<span class="pill d">Mới</span>':'<span class="pill">Đã xem</span>'}</td></tr>`).join('')}</table>`;
function newP(){P.unshift({id:'p'+Date.now(),cat:'ai',name:'New Project',client:'',year:2026,pub:0,feat:0,c:['#4F46E5','#22D3EE'],tech:[],t:{vi:'',en:''},d:{vi:'',en:''},r:{vi:'',en:''}});edit=0;render()}
function editor(){const p=P[edit];const i=(id,l,v)=>`<div class="f"><label>${l}</label><input id="${id}" value="${h(v)}"></div>`;
return`<a class="crumb" href="javascript:edit=null;render()">← Quay lại</a><h2>Chỉnh sửa dự án</h2><div class="card" style="margin-top:20px"><div class="two">${i('e1','Tiêu đề (VI)',p.t.vi)}${i('e2','Title (EN)',p.t.en)}</div><div class="two"><div class="f"><label>Mô tả (VI)</label><textarea id="e3" rows="3">${h(p.d.vi)}</textarea></div><div class="f"><label>Description (EN)</label><textarea id="e4" rows="3">${h(p.d.en)}</textarea></div></div><div class="two">${i('e5','Kết quả (VI)',p.r.vi)}${i('e6','Result (EN)',p.r.en)}</div><div class="two">${i('e7','Khách hàng',p.client)}${i('e8','Năm',p.year)}</div><div class="two"><div class="f"><label>Lĩnh vực</label><select id="e9">${Object.entries(T.vi.cats).map(([k,v])=>`<option value="${k}" ${p.cat==k?'selected':''}>${v}</option>`).join('')}</select></div>${i('e10','Công nghệ (cách nhau dấu phẩy)',p.tech.join(', '))}</div><div class="f"><label>Ảnh bìa / Cover (kéo thả hoặc chọn file)</label><input type="file"></div><div class="f"><label>Trạng thái</label><select id="e11"><option value="1" ${p.pub?'selected':''}>Đã đăng</option><option value="0" ${p.pub?'':'selected'}>Nháp</option></select></div><button class="btn p" onclick="saveP()">Lưu</button></div>`}
function saveP(){const p=P[edit],v=i=>$('#e'+i).value;p.t={vi:v(1),en:v(2)};p.d={vi:v(3),en:v(4)};p.r={vi:v(5),en:v(6)};p.client=v(7);p.year=+v(8)||2026;p.cat=v(9);p.tech=v(10).split(',').map(s=>s.trim()).filter(Boolean);p.pub=+v(11);edit=null;render()}
function render(){const r=route();document.documentElement.lang=L;let b;if(r[0]=='admin'){b=nav(r).replace(/<nav>.*<\/nav>/,'<nav></nav>')+admin(r[1])}else{b=nav(r)+(r[0]=='projects'?(r[1]?detail(r[1]):projects()):r[0]=='members'?members():r[0]=='about'||r[0]=='careers'?staticPage(r[0]):r[0]=='contact'?contact():home())}
$('#app').innerHTML=b;if(r[0]!='contact')sent=0}
addEventListener('hashchange',()=>{edit=null;render();scrollTo(0,0)});render();
</script></body></html>
